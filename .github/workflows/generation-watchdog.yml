# ============================================================================
# NAIJAMARKET INTEL — Price Generation Watchdog v5
# File: .github/workflows/generation-watchdog.yml
# ============================================================================
#
# ARCHITECTURE:
#   Single job with three steps:
#   1. Keepalive ping — wakes the function app
#   2. Wait 90 seconds — gives Azure time to fully initialise the host
#   3. Watchdog call — hits a warm host, checks/fills missing slots
#
# WHY SINGLE JOB (v5 change from v4):
#   v4 used two separate jobs (keepalive + watchdog). GitHub runs jobs in
#   parallel by default. `needs: keepalive` makes watchdog wait for keepalive
#   to finish, but doesn't add any delay — watchdog fires the instant
#   keepalive completes, before Azure has fully started the function host.
#   Single job with an explicit sleep guarantees the 90s warm-up window.
#
# COLD START TIMELINE (Azure Consumption + WEBSITE_RUN_FROM_PACKAGE):
#   T+0s:   First ping hits Azure — 503 returned, host starts waking
#   T+5s:   Azure downloads package blob from storage
#   T+30s:  Package mounted, Python interpreter loading
#   T+60s:  Functions registering, timers binding
#   T+90s:  Host fully ready — HTTP requests return 200
#   Waiting 90s after first ping guarantees we hit a warm host.
#
# SCHEDULE (UTC):
#   */15 * * * *    — every 15 min (prevents idle timeout, keeps app warm)
#   0 9,12,15 * * * — 3x daily watchdog (fills missed generation slots)
#
# SECRETS: WATCHDOG_KEY — generation_watchdog Azure Function host key
# ============================================================================

name: Price Generation Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'   # keepalive every 15 min
    - cron: '0 9 * * *'      # watchdog 09:00 UTC
    - cron: '0 12 * * *'     # watchdog 12:00 UTC
    - cron: '0 15 * * *'     # watchdog 15:00 UTC
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    name: Keep warm and check generation slots

    steps:
      # ── Step 1: Log context ─────────────────────────────────────────────
      - name: Log run context
        run: |
          echo "NaijaMarket Intel — Generation Watchdog v5"
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "WAT: $(TZ='Africa/Lagos' date '+%Y-%m-%d %H:%M:%S')"

      # ── Step 2: Ping to wake the function app ───────────────────────────
      # Sends a ping request. Azure starts waking the host on first contact.
      # We don't care about the response here — 503 is expected and fine.
      # The important thing is the wake signal is sent.
      - name: Ping function app (wake signal)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 15 \
            -X POST -H "Content-Type: application/json" -d '{"ping":true}' \
            "https://func-naijamarket-scraper.azurewebsites.net/api/generation_watchdog?code=${{ secrets.WATCHDOG_KEY }}")
          echo "Wake ping: HTTP $STATUS (503 = cold start waking, any other = already warm)"

      # ── Step 3: Wait for host to fully initialise ───────────────────────
      # Azure Consumption + WEBSITE_RUN_FROM_PACKAGE needs ~60-90 seconds
      # to download the package blob, mount it, and start the Python host.
      # We wait 90 seconds to guarantee the host is ready before the real call.
      # On warm runs (app was already active), this wait is wasted but harmless.
      - name: Wait for host initialisation
        run: |
          echo "Waiting 90 seconds for function host to initialise..."
          sleep 90
          echo "Wait complete — proceeding to watchdog call"

      # ── Step 4: Call the watchdog ───────────────────────────────────────
      # By now the host is warm. The watchdog checks Daily_Prices for
      # today's missing slots and runs sp_Generate_Daily_Prices for each.
      # On */15 runs: all slots exist → returns immediately with "nothing to do"
      # On 09:00/12:00/15:00 runs: fills any missed slots → runs ~2-3 min/slot
      - name: Check and fill missing generation slots
        run: |
          echo "Calling generation_watchdog..."
          RESPONSE=$(curl -s \
            -X POST -H "Content-Type: application/json" -d '{}' \
            -m 600 \
            -w "\n---HTTP_STATUS:%{http_code}---" \
            "https://func-naijamarket-scraper.azurewebsites.net/api/generation_watchdog?code=${{ secrets.WATCHDOG_KEY }}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/---HTTP_STATUS:[0-9]*---//')

          echo "HTTP Status: $HTTP_STATUS"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Success"
          else
            echo "❌ HTTP $HTTP_STATUS — check Azure Portal → func-naijamarket-scraper"
            exit 1
          fi
