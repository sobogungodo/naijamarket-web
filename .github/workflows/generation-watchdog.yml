# ============================================================================
# NAIJAMARKET INTEL — Price Generation Watchdog v4
# File: .github/workflows/generation-watchdog.yml
# ============================================================================
#
# PURPOSE:
#   Two jobs in one workflow:
#
#   JOB 1 — keepalive (runs every 15 minutes, all day)
#   Pings the function app to prevent cold starts. Azure Consumption plan
#   shuts down after ~20 minutes of inactivity. A 15-minute ping keeps it
#   permanently warm at zero cost. This job never triggers generation —
#   it only hits a lightweight endpoint to keep the host process alive.
#
#   JOB 2 — watchdog (runs 3x daily at 09:00, 12:00, 15:00 UTC)
#   Calls generation_watchdog to check and fill any missing Daily_Prices
#   slots. Because the keepalive job runs every 15 minutes, by the time
#   the watchdog fires the app is already warm — no cold start delays.
#
# WHY KEEPALIVE WORKS:
#   Azure Consumption plan has a 20-minute idle timeout. If any HTTP request
#   hits the function app within those 20 minutes, the timer resets.
#   GitHub Actions free tier allows up to 2,000 minutes/month.
#   15-minute pings = 4/hr × 24hr × 30 days = 2,880 runs/month.
#   Each keepalive run takes ~5 seconds = 240 minutes/month total.
#   Still within the 2,000 minute free tier.
#
# SCHEDULE SUMMARY:
#   */15 * * * *  — keepalive ping every 15 minutes (prevents cold start)
#   0 9,12,15 * * * — watchdog check at 09:00, 12:00, 15:00 UTC
#
# SECRETS REQUIRED:
#   WATCHDOG_KEY — Azure Function host key for generation_watchdog
# ============================================================================

name: Price Generation Watchdog

on:
  schedule:
    # ── Keepalive: every 15 minutes to prevent cold starts ─────────────────
    # GitHub Actions minimum cron interval is 5 minutes.
    # We use 15 minutes — well within the 20-minute Azure idle timeout.
    - cron: '*/15 * * * *'

    # ── Watchdog: 3x daily to catch missed generation slots ────────────────
    - cron: '0 9 * * *'    # 09:00 UTC — 90 min after morning timer
    - cron: '0 12 * * *'   # 12:00 UTC — 90 min after midday timer
    - cron: '0 15 * * *'   # 15:00 UTC — 90 min after afternoon timer

  workflow_dispatch:         # manual trigger from GitHub Actions UI

jobs:
  # ── JOB 1: Keep-alive ping ──────────────────────────────────────────────
  # Runs on every schedule trigger (including the */15 ones).
  # Lightweight — just pings the endpoint to reset the idle timer.
  keepalive:
    runs-on: ubuntu-latest
    name: Keep function app warm
    steps:
      - name: Ping function app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 15 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"ping": true}' \
            "https://func-naijamarket-scraper.azurewebsites.net/api/generation_watchdog?code=${{ secrets.WATCHDOG_KEY }}")
          echo "$(date -u '+%H:%M:%S UTC') — keepalive ping: HTTP $STATUS"
          # Don't fail on 503 — cold start during keepalive is fine,
          # the ping itself warms it up for the next call
          exit 0

  # ── JOB 2: Generation watchdog ──────────────────────────────────────────
  # Only meaningful at 09:00, 12:00, 15:00 UTC.
  # At */15 times, the watchdog will find all slots present and exit fast.
  # At 09:00/12:00/15:00, it checks for missing slots and fills them.
  watchdog:
    runs-on: ubuntu-latest
    name: Check and fill missing generation slots
    # Run after keepalive to ensure app is warm
    needs: keepalive
    steps:
      - name: Log run context
        run: |
          echo "NaijaMarket Intel — Generation Watchdog v4"
          echo "Time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Time (WAT): $(TZ='Africa/Lagos' date '+%Y-%m-%d %H:%M:%S')"
          echo "Trigger: ${{ github.event_name }}"

      - name: Trigger generation watchdog
        run: |
          # App should be warm from keepalive job above.
          # -m 600 = 10 min timeout for generation (worst case ~9 min for 3 slots)
          RESPONSE=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            -m 600 \
            -w "\n---HTTP_STATUS:%{http_code}---" \
            "https://func-naijamarket-scraper.azurewebsites.net/api/generation_watchdog?code=${{ secrets.WATCHDOG_KEY }}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/---HTTP_STATUS:[0-9]*---//')

          echo "HTTP Status: $HTTP_STATUS"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Watchdog completed successfully"
          else
            echo "❌ HTTP $HTTP_STATUS — check Azure Portal → func-naijamarket-scraper"
            exit 1
          fi
