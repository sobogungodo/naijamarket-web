# ============================================================================
# NAIJAMARKET INTEL — Price Generation Watchdog v3
# File: .github/workflows/generation-watchdog.yml
# ============================================================================
#
# PURPOSE:
#   Safety net for the daily price generation pipeline.
#   Calls the generation_watchdog Azure Function 3x daily.
#   The watchdog checks Daily_Prices for missing slots and fills them.
#
# WHY RETRY EXISTS (v3 fix):
#   func-naijamarket-scraper runs on Azure Consumption plan with
#   WEBSITE_RUN_FROM_PACKAGE. After any deployment or ~20 min inactivity,
#   Azure must download and mount the package blob before the host starts.
#   This takes 60-120 seconds. Previous v2 only waited 30s between retries
#   which was insufficient. v3 waits 60s with up to 5 attempts.
#
# SCHEDULE (all UTC):
#   09:00 — 90 min after morning timer   (07:30 UTC / 08:30 WAT)
#   12:00 — 90 min after midday timer    (10:30 UTC / 11:30 WAT)
#   15:00 — 90 min after afternoon timer (13:30 UTC / 14:30 WAT)
#
# SECRETS REQUIRED:
#   WATCHDOG_KEY — Azure Function host key for generation_watchdog
#   Add at: Repository → Settings → Secrets → Actions → New secret
#
# MANUAL TRIGGER:
#   Actions tab → Price Generation Watchdog → Run workflow button
# ============================================================================

name: Price Generation Watchdog

on:
  schedule:
    - cron: '0 9 * * *'    # 09:00 UTC — catches missed morning slot
    - cron: '0 12 * * *'   # 12:00 UTC — catches missed midday slot
    - cron: '0 15 * * *'   # 15:00 UTC — catches missed afternoon slot
  workflow_dispatch:         # manual trigger from GitHub Actions UI

jobs:
  trigger-watchdog:
    runs-on: ubuntu-latest
    name: Check and fill missing generation slots

    steps:
      # ── Step 1: Log run context ─────────────────────────────────────────
      - name: Log run context
        run: |
          echo "============================================"
          echo "NaijaMarket Intel — Generation Watchdog v3"
          echo "Run time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Run time (WAT): $(TZ='Africa/Lagos' date '+%Y-%m-%d %H:%M:%S')"
          echo "Trigger: ${{ github.event_name }}"
          echo "============================================"

      # ── Step 2: Warm up the function app ───────────────────────────────
      # Azure Consumption plan + WEBSITE_RUN_FROM_PACKAGE needs 60-120s
      # to download and mount the package blob after cold start.
      # We ping repeatedly until we get a non-503 response or exhaust 5 attempts.
      # Each attempt waits 60 seconds — total warm-up budget: 5 minutes.
      - name: Warm up function app
        run: |
          echo "Warming up function app (may take up to 5 minutes after cold start)..."
          WARMUP_ATTEMPTS=5
          WARMUP_WAIT=60

          for i in $(seq 1 $WARMUP_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{}' \
              "https://func-naijamarket-scraper.azurewebsites.net/api/generation_watchdog?code=${{ secrets.WATCHDOG_KEY }}")

            echo "Warm-up attempt $i/$WARMUP_ATTEMPTS: HTTP $STATUS"

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "500" ]; then
              # 200 = ready and succeeded, 500 = ready but error — either way host is up
              echo "✅ Function app is warm (HTTP $STATUS)"
              break
            fi

            if [ "$i" -lt "$WARMUP_ATTEMPTS" ]; then
              echo "Still cold — waiting ${WARMUP_WAIT}s before next attempt..."
              sleep $WARMUP_WAIT
            else
              echo "⚠️  Function app still returning $STATUS after all warm-up attempts."
              echo "Will proceed anyway — the main step has its own retry logic."
            fi
          done

      # ── Step 3: Call the watchdog ───────────────────────────────────────
      # Now that the function app should be warm, call the watchdog properly.
      # The watchdog body is {} (empty) — it auto-detects today's missing slots.
      # -m 600 = 10 minute timeout (each generation slot takes ~2-3 minutes;
      # worst case all 3 slots missing = ~9 minutes total).
      - name: Trigger generation watchdog
        run: |
          echo "Calling generation_watchdog for slot check..."
          echo ""

          RESPONSE=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            -m 600 \
            -w "\n---HTTP_STATUS:%{http_code}---" \
            "https://func-naijamarket-scraper.azurewebsites.net/api/generation_watchdog?code=${{ secrets.WATCHDOG_KEY }}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/---HTTP_STATUS:[0-9]*---//')

          echo "HTTP Status: $HTTP_STATUS"
          echo ""
          echo "Response:"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          echo ""

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Watchdog completed successfully"
          elif [ "$HTTP_STATUS" = "503" ]; then
            echo "❌ Function app still cold after warm-up phase."
            echo "This is unusual — check Azure Portal for deployment issues:"
            echo "  func-naijamarket-scraper → Overview → check State"
            exit 1
          else
            echo "❌ Unexpected HTTP $HTTP_STATUS"
            echo "Check: Azure Portal → func-naijamarket-scraper → Monitor"
            exit 1
          fi
