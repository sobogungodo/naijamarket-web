# ============================================================================
# NAIJAMARKET INTEL — Price Generation Watchdog
# File: .github/workflows/generation-watchdog.yml
# Version: 2 — added retry logic for Azure cold starts
# ============================================================================
#
# PURPOSE:
#   Safety net for the daily price generation pipeline.
#   Calls the generation_watchdog Azure Function 3x daily.
#   The function checks Daily_Prices for missing slots and fills them.
#
# WHY RETRY EXISTS:
#   func-naijamarket-scraper runs on Azure Consumption plan.
#   Consumption plan apps shut down after ~20 min of inactivity (cold start).
#   The first HTTP call to a cold app returns HTTP 503 "Function host is not
#   running" while Azure wakes it up (~10-30 seconds). The retry loop waits
#   30 seconds and tries again — by then the host is warm and responds.
#
# SCHEDULE (all UTC):
#   09:00 — 90 min after morning timer   (07:30 UTC / 08:30 WAT)
#   12:00 — 90 min after midday timer    (10:30 UTC / 11:30 WAT)
#   15:00 — 90 min after afternoon timer (13:30 UTC / 14:30 WAT)
#
# SECRETS REQUIRED:
#   WATCHDOG_KEY — Azure Function host key for generation_watchdog
#   Add at: Repository → Settings → Secrets → Actions → New secret
#
# MANUAL TRIGGER:
#   Actions tab → Price Generation Watchdog → Run workflow button
# ============================================================================

name: Price Generation Watchdog

on:
  schedule:
    - cron: '0 9 * * *'    # 09:00 UTC — catches missed morning slot
    - cron: '0 12 * * *'   # 12:00 UTC — catches missed midday slot
    - cron: '0 15 * * *'   # 15:00 UTC — catches missed afternoon slot
  workflow_dispatch:         # manual trigger from GitHub Actions UI

jobs:
  trigger-watchdog:
    runs-on: ubuntu-latest
    name: Check and fill missing generation slots

    steps:
      # ── Step 1: Log run context ─────────────────────────────────────────
      - name: Log run context
        run: |
          echo "============================================"
          echo "NaijaMarket Intel — Generation Watchdog v2"
          echo "Run time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Run time (WAT): $(TZ='Africa/Lagos' date '+%Y-%m-%d %H:%M:%S')"
          echo "Trigger: ${{ github.event_name }}"
          echo "============================================"

      # ── Step 2: Wake up the function app (handles cold start) ───────────
      # Azure Consumption plan shuts down after ~20 min of inactivity.
      # First call returns 503 "Function host is not running" for ~10-30s.
      # This step pings the health endpoint to wake it up before the real call.
      - name: Wake up function app
        run: |
          echo "Pinging function app to wake from cold start..."
          # Allow up to 3 attempts, 15 seconds apart
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
              "https://func-naijamarket-scraper.azurewebsites.net/api/generation_watchdog?code=${{ secrets.WATCHDOG_KEY }}" \
              -X POST -H "Content-Type: application/json" -d '{"ping": true}')
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "500" ]; then
              # 200 = warm and running, 500 = warm but error (handle in next step)
              echo "Function app is warm."
              break
            fi
            echo "Still cold (HTTP $STATUS) — waiting 30 seconds..."
            sleep 30
          done

      # ── Step 3: Call the watchdog with retry ────────────────────────────
      # The actual generation check. Retries up to 3 times in case of
      # transient 503s. Each generation slot takes ~2-3 minutes.
      # Total timeout per attempt: 10 minutes (600 seconds).
      - name: Trigger generation watchdog
        run: |
          echo "Calling generation_watchdog..."

          MAX_RETRIES=3
          ATTEMPT=0
          SUCCESS=false

          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "--- Attempt $ATTEMPT of $MAX_RETRIES ---"

            RESPONSE=$(curl -s \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{}' \
              -m 600 \
              -w "\n---HTTP_STATUS:%{http_code}---" \
              "https://func-naijamarket-scraper.azurewebsites.net/api/generation_watchdog?code=${{ secrets.WATCHDOG_KEY }}")

            HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | sed 's/---HTTP_STATUS:[0-9]*---//')

            echo "HTTP Status: $HTTP_STATUS"
            echo "Response:"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

            if [ "$HTTP_STATUS" = "200" ]; then
              echo ""
              echo "✅ Watchdog completed successfully on attempt $ATTEMPT"
              SUCCESS=true
              break
            elif [ "$HTTP_STATUS" = "503" ]; then
              echo "⚠️  503 — function still cold. Waiting 30 seconds before retry..."
              sleep 30
            else
              echo "❌ Unexpected HTTP $HTTP_STATUS — not retrying"
              break
            fi
          done

          if [ "$SUCCESS" = "false" ]; then
            echo ""
            echo "ERROR: Watchdog failed after $MAX_RETRIES attempts"
            echo "Check: Azure Portal → func-naijamarket-scraper → Monitor"
            echo "Or run manually: EXEC dbo.sp_Generate_Daily_Prices in Portal Query Editor"
            exit 1
          fi
