<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Chart/Graph representing price trends -->
  <g transform="translate(80, 150)">
    <!-- Grid lines (subtle) -->
    <line x1="0" y1="50" x2="352" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="0" y1="110" x2="352" y2="110" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="0" y1="170" x2="352" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    
    <!-- Price trend line (upward) -->
    <polyline 
      points="0,180 60,150 120,160 180,100 240,80 300,40 352,20" 
      fill="none" 
      stroke="url(#chartGrad)" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    
    <!-- Data points -->
    <circle cx="0" cy="180" r="12" fill="white"/>
    <circle cx="60" cy="150" r="10" fill="white" opacity="0.9"/>
    <circle cx="120" cy="160" r="10" fill="white" opacity="0.9"/>
    <circle cx="180" cy="100" r="10" fill="white" opacity="0.9"/>
    <circle cx="240" cy="80" r="10" fill="white" opacity="0.9"/>
    <circle cx="300" cy="40" r="10" fill="white" opacity="0.9"/>
    <circle cx="352" cy="20" r="14" fill="white"/>
    
    <!-- Upward arrow indicator -->
    <g transform="translate(310, -30)">
      <polygon points="20,0 40,30 30,30 30,50 10,50 10,30 0,30" fill="white"/>
    </g>
  </g>
  
  <!-- "NM" text at bottom -->
  <text 
    x="256" 
    y="420" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="64" 
    font-weight="800" 
    fill="white"
    opacity="0.95"
  >
    NM
  </text>
</svg>
